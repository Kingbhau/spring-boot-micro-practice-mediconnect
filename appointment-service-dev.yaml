server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mediconnect_appointment_db
    username: postgres
    password: Tushar
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/mediconnect

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true


resilience4j:
  circuitbreaker:
    instances:
      patientService:
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 5s
        failureRateThreshold: 60
        ignoreExceptions:
          - com.mediconnect.appointment.exception.PatientNotFoundException
          - com.mediconnect.appointment.exception.DownstreamAuthenticationException
      doctorService:
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 10s
        failureRateThreshold: 60
        ignoreExceptions:
          - com.mediconnect.appointment.exception.DoctorNotFoundException
          - com.mediconnect.appointment.exception.DownstreamAuthenticationException
